<!DOCTYPE html>
<html>
  <head>
    <title>Solo2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  </head>
  <style>

    .pfp {
      width: 200px;
    }

    .username {
      font-family: "Roboto";
      font-size: 20px;
      margin-top: 7px;
      margin-bottom: 10px;
    }

    .mut {
      font-family: "Roboto";
      color: rgb(146, 146, 146);
      margin-top: 1px;
      margin-bottom: 10px;
    }
    
    .fren {
      font-family: "Roboto";
      background-color: rgb(87, 160, 255);
      color: white;
      display: inline-block;
      border: none;
      border-radius: 4px;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 15px;
      padding-right: 15px;
      margin-top: 1px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .fren:hover {
      background-color: rgb(0, 122, 255);
    }

  </style>
  <body>
    <div class="container">
    <img class="pfp" src="thumbnails/leon.png">

    <p class="username">
      Leon
    </p>

    <p class="mut">
      5 mutual friends
    </p>

    <button class="fren">
      Add Friend
    </button>
    </div>
  </body>
</html>
